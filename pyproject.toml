[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-foundry"
version = "0.1.0"
description = "A local-first AI engineering studio for building, testing, evaluating, and reproducing AI systems."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "James Earl Stambaugh III", email = "mythologyprospector@gmail.com"}]
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
